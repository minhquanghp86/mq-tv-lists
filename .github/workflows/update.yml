name: Update playlist

on:
  schedule:
    - cron: "0 18 * * *"   # 01:00 ICT hằng ngày
  workflow_dispatch:
  push:
    paths:
      - "update_iptv.py"
      - "sources.json"
      - "channels.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build playlist
        run: python update_iptv.py

      - name: Commit result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vn.m3u mq-tv.json state/health.json
          VIETNAM_TIME=$(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')
          git diff --cached --quiet || git commit -m "Cập nhật danh sách kênh ($VIETNAM_TIME ICT)"
          git push
